name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Static validation: YAML well-formed, Python compiles, versions in sync ──
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: YAML + py_compile + version-sync checks
        run: python tests/validate_repo.py

  # ── Regression suite + code-quality gate (the "Sonar-lite" loop) ──
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests pytest pytest-cov ruff
      - name: Ruff (code quality)
        run: ruff check .
      - name: Pytest (regression) with coverage
        env:
          GODMODE_TESTING: "1"
          GOD_DATA_DIR: "/tmp/godmode-data"
        run: pytest tests/ -q --cov=god_mode --cov-report=term-missing

  # ── Ansible playbooks + shipped YAML are well-formed (advisory: yamllint is
  #    opinionated about cosmetics; ansible-lint flags best-practices that may
  #    not apply to these small gather/power playbooks). ──
  ansible-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ansible-lint yamllint
      - name: yamllint (relaxed) on playbooks
        run: yamllint -d relaxed god_mode/rootfs/usr/share/god-mode/ansible/
      - name: ansible-lint on playbooks
        run: ansible-lint god_mode/rootfs/usr/share/god-mode/ansible/playbooks/ || true

  # ── Official add-on config linter. Was advisory-only for a while because
  #    it failed, and a red job nobody looks at stops informing anyone of
  #    anything. What it complained about was three keys left at their
  #    default value; removed, it passes. Now it blocks, to keep it that
  #    way. ──
  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./god_mode"

  # ── Full Docker build (native amd64) — validates the Dockerfile end to end,
  #    including apk/pip deps and the rootfs copy. ──
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on image (amd64)
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 \
            -t god-mode:ci god_mode

  # ── Release. Only on a `v*` tag: builds multi-arch, pushes to GHCR and
  #    opens the Release. The add-on is local (built on HA itself), so the
  #    published image is there to let it install without compiling and to
  #    have a reproducible artifact per version. ──
  release:
    needs: [validate, tests, build-amd64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the Release
      packages: write        # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag and config.yaml agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CFG=$(grep -E '^version:' god_mode/config.yaml | cut -d'"' -f2)
          echo "tag=$TAG config.yaml=$CFG"
          [ "$TAG" = "$CFG" ] || { echo "::error::tag $TAG does not match config.yaml $CFG"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per architecture, each with ITS OWN base. A multi-platform
      # build-push with a single BUILD_FROM doesn't work here: the aarch64
      # base won't boot under amd64.
      - name: Build and publish each architecture
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          pip -q install pyyaml
          python3 -c 'import yaml; [print(a, b) for a, b in yaml.safe_load(open("god_mode/build.yaml"))["build_from"].items()]' > /tmp/bases.txt
          cat /tmp/bases.txt
          while read -r ARCH BASE; do
            echo "::group::$ARCH from $BASE"
            docker buildx build \
              --platform "linux/$([ "$ARCH" = amd64 ] && echo amd64 || echo arm64)" \
              --build-arg "BUILD_FROM=$BASE" \
              --tag "$REPO/$ARCH:$TAG" \
              --tag "$REPO/$ARCH:latest" \
              --push god_mode
            echo "::endgroup::"
          done < /tmp/bases.txt

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

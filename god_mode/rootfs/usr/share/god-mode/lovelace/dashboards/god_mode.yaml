      - type: custom:auto-entities
        card: { type: history-graph, title: "CPU + Temp", hours_to_show: 6 }
        filter:
          template: |
            {%- for s in states.sensor if s.entity_id.startswith('sensor.god_host_') and (s.entity_id.endswith('_cpu') or s.entity_id.endswith('_temp')) -%}
              {%- set host = s.entity_id | regex_replace('^sensor.god_host_', '') | regex_replace('_cpu$|_temp$', '') -%}
              {%- if state_attr('binary_sensor.god_host_' ~ host ~ '_online', 'category') == 'sbc' -%}
                {{ {'entity': s.entity_id} }},
              {%- endif -%}
            {%- endfor -%}


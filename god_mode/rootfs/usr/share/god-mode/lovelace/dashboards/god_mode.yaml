# AUTO-GENERATED v0.3.4 -- 100% dynamic dashboard
# Discovery via custom:auto-entities (HACS).
# Hosts added later (via wizard) automatically appear on next refresh.
title: GOD Mode
views:

  # ============ OVERVIEW ============
  - title: Overview
    path: overview
    icon: mdi:eye-outline
    cards:
      - type: markdown
        content: |
          # GOD Mode · Overview
          _Dynamic homelab health (auto-discovers new hosts)_

      - type: custom:auto-entities
        card: { type: glance, title: "Hosts online", columns: 6, show_state: false }
        filter:
          include:
            - entity_id: binary_sensor.god_host_*_online
        sort: { method: friendly_name }

      - type: custom:auto-entities
        card: { type: history-graph, title: "CPU all hosts (%)", hours_to_show: 6 }
        filter:
          include:
            - entity_id: sensor.god_host_*_cpu

      - type: custom:auto-entities
        card: { type: history-graph, title: "Memory all hosts (%)", hours_to_show: 6 }
        filter:
          include:
            - entity_id: sensor.god_host_*_mem

      - type: custom:auto-entities
        card: { type: history-graph, title: "Swap usage (%)", hours_to_show: 6 }
        filter:
          include:
            - entity_id: sensor.god_host_*_swap

      - type: custom:auto-entities
        card: { type: history-graph, title: "Disk max (%)", hours_to_show: 24 }
        filter:
          include:
            - entity_id: sensor.god_host_*_disk

      - type: custom:auto-entities
        card: { type: history-graph, title: "Temperature (°C)", hours_to_show: 6 }
        filter:
          include:
            - entity_id: sensor.god_host_*_temp

      - type: custom:auto-entities
        card: { type: entities, title: "SMART health" }
        filter:
          include:
            - entity_id: sensor.god_host_*_smart_health
        sort: { method: state, reverse: true }
        show_empty: false

  # ============ BY CATEGORY (filtered via category attribute) ============
  - title: Proxmox cluster
    path: pve_node
    icon: mdi:server-network
    cards:
      - type: markdown
        content: "## Proxmox cluster"
      - type: custom:auto-entities
        card: { type: glance, title: "Online", columns: 4 }
        filter:
          include:
            - entity_id: binary_sensor.god_host_*_online
              attributes: { category: pve_node }
      - type: custom:auto-entities
        card: { type: history-graph, title: "CPU", hours_to_show: 12 }
        filter:
          template: |
            {%- for s in states.sensor if s.entity_id.startswith('sensor.god_host_') and s.entity_id.endswith('_cpu') -%}
              {%- set host = s.entity_id | regex_replace('^sensor.god_host_', '') | regex_replace('_cpu$', '') -%}
              {%- if state_attr('binary_sensor.god_host_' ~ host ~ '_online', 'category') == 'pve_node' -%}
                {{ {'entity': s.entity_id} }},
              {%- endif -%}
            {%- endfor -%}
      - type: custom:auto-entities
        card: { type: history-graph, title: "RAM", hours_to_show: 12 }
        filter:
          template: |
            {%- for s in states.sensor if s.entity_id.startswith('sensor.god_host_') and s.entity_id.endswith('_mem') -%}
              {%- set host = s.entity_id | regex_replace('^sensor.god_host_', '') | regex_replace('_mem$', '') -%}
              {%- if state_attr('binary_sensor.god_host_' ~ host ~ '_online', 'category') == 'pve_node' -%}
                {{ {'entity': s.entity_id} }},
              {%- endif -%}
            {%- endfor -%}


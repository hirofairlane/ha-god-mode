      - type: custom:auto-entities
        card: { type: history-graph, title: "Disk", hours_to_show: 24 }
        filter:
          template: |
            {%- for s in states.sensor if s.entity_id.startswith('sensor.god_host_') and s.entity_id.endswith('_disk') -%}
              {%- set host = s.entity_id | regex_replace('^sensor.god_host_', '') | regex_replace('_disk$', '') -%}
              {%- if state_attr('binary_sensor.god_host_' ~ host ~ '_online', 'category') == 'server' -%}
                {{ {'entity': s.entity_id} }},
              {%- endif -%}
            {%- endfor -%}


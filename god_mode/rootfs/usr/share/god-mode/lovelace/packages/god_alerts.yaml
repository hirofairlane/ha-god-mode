# =====================================================================
#  god_alerts.yaml - threshold alerts + telegram notify
#
#  Thresholds (warning / critical):
#    cpu_pct       >  80 / 95   sustained 5 min
#    mem_pct       >  85 / 95   sustained 3 min
#    swap_pct      >  50 / 80   sustained 5 min
#    disk_max_pct  >  85 / 95   sustained 0 min (immediate)
#    temp_max_c    >  75 / 85   sustained 2 min
#    smart_temp    >  55 / 65   sustained 2 min
#    smart_health  != PASSED    immediate critical
#    online        false        sustained 5 min (host disappeared)
#
#  Uses script.god_notify as the dispatcher:
#    - If input_text.god_telegram_chat_id is a positive integer -> Telegram
#    - Otherwise -> persistent_notification in HA UI
# =====================================================================

input_select:
  god_alerts_enabled:
    name: "GOD Mode · Alerts enabled"
    icon: mdi:bell
    options:
      - "on"
      - "off"
    initial: "on"

input_text:
  god_last_alert:
    name: "GOD Mode · Last alert"
    icon: mdi:bell-ring
    max: 255

script:
  god_notify:
    alias: "GOD Mode notify dispatcher"
    sequence:
      - choose:
          # Telegram path (chat_id valid)
          - conditions:
              - condition: template
                value_template: "{{ (states('input_text.god_telegram_chat_id') | int(0)) != 0 }}"
            sequence:
              - service: notify.telegram_bot_1353549989_1458801761
                data:
                  message: "{{ message | default('GOD Mode alert') }}"
      - service: persistent_notification.create
        data:
          notification_id: "{{ alert_id | default(now().timestamp() | string) }}"
          title: "{{ title | default('GOD Mode') }}"
          message: "{{ message | default('Alert') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.god_last_alert
        data:
          value: "{{ now().strftime('%H:%M') }} {{ message | truncate(200) }}"

# Threshold counters (god_alerts_warning_count, god_alerts_critical_count)
# are generated in god_hosts_linux.yaml by god-generate-yaml.py from the
# host list. Keep this file focused on the dispatcher + automations.

# ---------------------------------------------------------------------
# Automations: anti-flap cooldown + per-host state
# ---------------------------------------------------------------------
automation:
  - id: god_alert_critical_count_changed
    alias: "GOD Mode: critical alert dispatcher"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: sensor.god_alerts_critical_count
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
    action:
      - variables:
          n: "{{ trigger.to_state.state }}"
      - service: script.god_notify
        data:
          alert_id: "god_critical_summary"
          title: "🔴 GOD Mode CRITICAL"
          message: "{{ n }} host(s) en estado crítico. Revisa el dashboard."

  - id: god_alert_warning_count_changed
    alias: "GOD Mode: warning alert dispatcher"
    mode: queued
    max: 10
    trigger:
      - platform: numeric_state
        entity_id: sensor.god_alerts_warning_count
        above: 0
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
    action:
      - variables:
          n: "{{ states('sensor.god_alerts_warning_count') }}"
      - service: script.god_notify
        data:
          alert_id: "god_warning_summary"
          title: "🟡 GOD Mode warning"
          message: "{{ n }} host(s) en warning. Revisa el dashboard."

  - id: god_alert_host_count_drop
    alias: "GOD Mode: host(s) offline"
    mode: queued
    max: 30
    trigger:
      - platform: state
        entity_id: sensor.god_hosts_online_count
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
      - condition: template
        value_template: >
          {{ (trigger.to_state.state | int(0)) < (state_attr('sensor.god_hosts_online_count','total') | int(0)) }}
    action:
      - variables:
          online: "{{ trigger.to_state.state }}"
          total: "{{ state_attr('sensor.god_hosts_online_count','total') }}"
          offline_hosts: >
            {{ states.binary_sensor
                 | selectattr('entity_id','match','binary_sensor\\.god_host_.*_online$')
                 | selectattr('state','eq','off')
                 | map(attribute='attributes.friendly_label')
                 | list | join(', ') }}
      - service: script.god_notify
        data:
          alert_id: "god_offline_hosts"
          title: "🔴 GOD Mode: hosts offline"
          message: "{{ online }}/{{ total }} hosts online. Offline: {{ offline_hosts }}"

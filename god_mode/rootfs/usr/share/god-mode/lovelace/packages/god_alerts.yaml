# =====================================================================
#  god_alerts.yaml - threshold alerts + telegram notify
#
#  Thresholds (warning / critical):
#    cpu_pct       >  80 / 95   sustained 5 min
#    mem_pct       >  85 / 95   sustained 3 min
#    swap_pct      >  50 / 80   sustained 5 min
#    disk_max_pct  >  85 / 95   sustained 0 min (immediate)
#    temp_max_c    >  75 / 85   sustained 2 min
#    smart_temp    >  55 / 65   sustained 2 min
#    smart_health  != PASSED    immediate critical
#    online        false        sustained 5 min (host disappeared)
#
#  Uses script.god_notify as the dispatcher:
#    - If input_text.god_telegram_chat_id is a positive integer -> Telegram
#    - Otherwise -> persistent_notification in HA UI
# =====================================================================

input_select:
  god_alerts_enabled:
    name: "GOD Mode · Alerts enabled"
    icon: mdi:bell
    options:
      - "on"
      - "off"
    initial: "on"

input_text:
  god_last_alert:
    name: "GOD Mode · Last alert"
    icon: mdi:bell-ring
    max: 255

script:
  god_notify:
    alias: "GOD Mode notify dispatcher"
    sequence:
      - choose:
          # Telegram path (chat_id valid)
          - conditions:
              - condition: template
                value_template: "{{ (states('input_text.god_telegram_chat_id') | int(0)) != 0 }}"
            sequence:
              - service: notify.telegram_bot_1353549989_1458801761
                data:
                  message: "{{ message | default('GOD Mode alert') }}"
      - service: persistent_notification.create
        data:
          notification_id: "{{ alert_id | default(now().timestamp() | string) }}"
          title: "{{ title | default('GOD Mode') }}"
          message: "{{ message | default('Alert') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.god_last_alert
        data:
          value: "{{ now().strftime('%H:%M') }} {{ message | truncate(200) }}"

# ---------------------------------------------------------------------
# Threshold helpers (binary sensors) -- dynamic for any god_host_*_<metric>
# ---------------------------------------------------------------------
# We declare warning/critical templates per metric kind. They evaluate
# for EVERY host that has the corresponding sensor (via auto-detected
# host list). The list comes from the binary_sensor.god_host_*_online
# entities, which we already have for every onboarded host.

template:
  - sensor:
      # Aggregated counters used by automation triggers
      - name: "god_alerts_warning_count"
        unique_id: god_alerts_warning_count
        state: >
          {% set hosts = states.binary_sensor
              | selectattr('entity_id','match','binary_sensor\\.god_host_.*_online$')
              | map(attribute='entity_id') | list %}
          {% set warns = namespace(n=0) %}
          {% for he in hosts %}
            {% set h = he | regex_replace('^binary_sensor.god_host_', '') | regex_replace('_online$', '') %}
            {% set cpu  = states('sensor.god_host_' ~ h ~ '_cpu')  | float(0) %}
            {% set mem  = states('sensor.god_host_' ~ h ~ '_mem')  | float(0) %}
            {% set swap = states('sensor.god_host_' ~ h ~ '_swap') | float(0) %}
            {% set disk = states('sensor.god_host_' ~ h ~ '_disk') | float(0) %}
            {% set temp = states('sensor.god_host_' ~ h ~ '_temp') | float(0) %}
            {% set st   = states('sensor.god_host_' ~ h ~ '_smart_temp') | float(0) %}
            {% if cpu  > 80 or mem  > 85 or swap > 50 or disk > 85 or temp > 75 or st > 55 %}
              {% set warns.n = warns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ warns.n }}

      - name: "god_alerts_critical_count"
        unique_id: god_alerts_critical_count
        state: >
          {% set hosts = states.binary_sensor
              | selectattr('entity_id','match','binary_sensor\\.god_host_.*_online$')
              | map(attribute='entity_id') | list %}
          {% set crits = namespace(n=0) %}
          {% for he in hosts %}
            {% set h = he | regex_replace('^binary_sensor.god_host_', '') | regex_replace('_online$', '') %}
            {% set cpu  = states('sensor.god_host_' ~ h ~ '_cpu')  | float(0) %}
            {% set mem  = states('sensor.god_host_' ~ h ~ '_mem')  | float(0) %}
            {% set swap = states('sensor.god_host_' ~ h ~ '_swap') | float(0) %}
            {% set disk = states('sensor.god_host_' ~ h ~ '_disk') | float(0) %}
            {% set temp = states('sensor.god_host_' ~ h ~ '_temp') | float(0) %}
            {% set st   = states('sensor.god_host_' ~ h ~ '_smart_temp') | float(0) %}
            {% set sh   = states('sensor.god_host_' ~ h ~ '_smart_health') %}
            {% if cpu > 95 or mem > 95 or swap > 80 or disk > 95 or temp > 85 or st > 65 or sh in ['FAILED','FAIL'] %}
              {% set crits.n = crits.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ crits.n }}

# ---------------------------------------------------------------------
# Automations: anti-flap cooldown + per-host state
# ---------------------------------------------------------------------
automation:
  - id: god_alert_critical_count_changed
    alias: "GOD Mode: critical alert dispatcher"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: sensor.god_alerts_critical_count
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
    action:
      - variables:
          n: "{{ trigger.to_state.state }}"
      - service: script.god_notify
        data:
          alert_id: "god_critical_summary"
          title: "🔴 GOD Mode CRITICAL"
          message: "{{ n }} host(s) en estado crítico. Revisa el dashboard."

  - id: god_alert_warning_count_changed
    alias: "GOD Mode: warning alert dispatcher"
    mode: queued
    max: 10
    trigger:
      - platform: numeric_state
        entity_id: sensor.god_alerts_warning_count
        above: 0
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
    action:
      - variables:
          n: "{{ states('sensor.god_alerts_warning_count') }}"
      - service: script.god_notify
        data:
          alert_id: "god_warning_summary"
          title: "🟡 GOD Mode warning"
          message: "{{ n }} host(s) en warning. Revisa el dashboard."

  - id: god_alert_host_offline
    alias: "GOD Mode: host offline alert"
    mode: queued
    max: 30
    trigger:
      - platform: state
        entity_id: binary_sensor.god_host_zeratul_online
        to: "off"
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_select.god_alerts_enabled
        state: "on"
    action:
      - service: script.god_notify
        data:
          alert_id: "god_offline_zeratul"
          title: "🔴 GOD Mode: zeratul offline"
          message: "Zeratul lleva offline 5 min en GOD Mode."

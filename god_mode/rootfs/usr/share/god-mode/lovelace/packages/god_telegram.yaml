# =====================================================================
#  god_telegram.yaml - bot Telegram exclusivo para alertas GOD Mode
#
#  Bot @GOD_Mode666bot (token en !secret god_telegram_bot_token)
#  Canal/grupo: chat_id en !secret god_telegram_chat_id
#
#  PENDIENTE: rellenar god_telegram_chat_id en secrets.yaml cuando el
#  usuario haya creado el grupo y a~adido el bot.
# =====================================================================

telegram_bot:
  - platform: polling
    api_key: !secret god_telegram_bot_token
    allowed_chat_ids:
      - !secret god_telegram_chat_id
    parse_mode: html

notify:
  - name: god_mode_telegram
    platform: telegram
    chat_id: !secret god_telegram_chat_id

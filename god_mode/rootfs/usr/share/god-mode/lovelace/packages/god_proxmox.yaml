# =====================================================================
#  god_proxmox.yaml - estado del cluster Proxmox via PVE API
#
#  Auth: PVEAPIToken god@pve!godmode (role PVEAuditor, read-only)
#  Token vive en !secret pve_api_token  -> "god@pve!godmode=<uuid>"
#  Strategy: REST integration native, scan_interval 60s, varias
#  resources. Sensores derivados con value_template.
# =====================================================================

rest:
  # ---- Nodos del cluster ------------------------------------------------
  - resource: https://192.168.1.122:8006/api2/json/nodes
    headers:
      Authorization: !secret god_pve_api_authorization
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "god_pve_zeratul_status"
        unique_id: god_pve_zeratul_status
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','Zeratul') | list %}
          {{ n[0].status if n else 'unknown' }}
        icon: mdi:server-network

      - name: "god_pve_zeratul_cpu_pct"
        unique_id: god_pve_zeratul_cpu_pct
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','Zeratul') | list %}
          {{ (n[0].cpu * 100) | round(1) if n else 0 }}
        unit_of_measurement: "%"
        icon: mdi:cpu-64-bit

      - name: "god_pve_zeratul_mem_pct"
        unique_id: god_pve_zeratul_mem_pct
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','Zeratul') | list %}
          {{ (n[0].mem / n[0].maxmem * 100) | round(1) if n else 0 }}
        unit_of_measurement: "%"
        icon: mdi:memory

      - name: "god_pve_zeratul_uptime_h"
        unique_id: god_pve_zeratul_uptime_h
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','Zeratul') | list %}
          {{ (n[0].uptime / 3600) | round(1) if n else 0 }}
        unit_of_measurement: "h"
        icon: mdi:clock-outline

      - name: "god_pve_h340_status"
        unique_id: god_pve_h340_status
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','H340-ino2') | list %}
          {{ n[0].status if n else 'unknown' }}
        icon: mdi:server

      - name: "god_pve_h340_cpu_pct"
        unique_id: god_pve_h340_cpu_pct
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','H340-ino2') | list %}
          {{ (n[0].cpu * 100) | round(1) if n else 0 }}
        unit_of_measurement: "%"

      - name: "god_pve_h340_mem_pct"
        unique_id: god_pve_h340_mem_pct
        value_template: >
          {% set n = value_json.data | selectattr('node','eq','H340-ino2') | list %}
          {{ (n[0].mem / n[0].maxmem * 100) | round(1) if n else 0 }}
        unit_of_measurement: "%"

  # ---- VMs en zeratul ---------------------------------------------------
  - resource: https://192.168.1.122:8006/api2/json/nodes/Zeratul/qemu
    headers:
      Authorization: !secret god_pve_api_authorization
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "god_pve_vms_running"
        unique_id: god_pve_vms_running
        value_template: >
          {{ value_json.data | selectattr('status','eq','running') | list | length }}
        icon: mdi:cube
        json_attributes_path: "$.data"

      - name: "god_pve_vm_100_status"
        unique_id: god_pve_vm_100_status
        value_template: >
          {% set v = value_json.data | selectattr('vmid','eq',100) | list %}
          {{ v[0].status if v else 'unknown' }}

      - name: "god_pve_vm_102_status"
        unique_id: god_pve_vm_102_status
        value_template: >
          {% set v = value_json.data | selectattr('vmid','eq',102) | list %}
          {{ v[0].status if v else 'unknown' }}

      - name: "god_pve_vm_105_status"
        unique_id: god_pve_vm_105_status
        value_template: >
          {% set v = value_json.data | selectattr('vmid','eq',105) | list %}
          {{ v[0].status if v else 'unknown' }}

  # ---- LXCs en zeratul --------------------------------------------------
  - resource: https://192.168.1.122:8006/api2/json/nodes/Zeratul/lxc
    headers:
      Authorization: !secret god_pve_api_authorization
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "god_pve_cts_running"
        unique_id: god_pve_cts_running
        value_template: >
          {{ value_json.data | selectattr('status','eq','running') | list | length }}
        icon: mdi:package-variant
        json_attributes_path: "$.data"

      - name: "god_pve_ct_101_status"
        unique_id: god_pve_ct_101_status
        value_template: >
          {% set c = value_json.data | selectattr('vmid','eq',101) | list %}
          {{ c[0].status if c else 'unknown' }}

      - name: "god_pve_ct_103_status"
        unique_id: god_pve_ct_103_status
        value_template: >
          {% set c = value_json.data | selectattr('vmid','eq',103) | list %}
          {{ c[0].status if c else 'unknown' }}

      - name: "god_pve_ct_104_status"
        unique_id: god_pve_ct_104_status
        value_template: >
          {% set c = value_json.data | selectattr('vmid','eq',104) | list %}
          {{ c[0].status if c else 'unknown' }}

      - name: "god_pve_ct_171_status"
        unique_id: god_pve_ct_171_status
        value_template: >
          {% set c = value_json.data | selectattr('vmid','eq',171) | list %}
          {{ c[0].status if c else 'unknown' }}

# ---------------------------------------------------------------------
# Binary sensors derivados: VM/CT online si status==running
# ---------------------------------------------------------------------
binary_sensor:
  - platform: template
    sensors:
      god_pve_zeratul_online:
        unique_id: god_pve_zeratul_online
        friendly_name: "PVE Zeratul online"
        device_class: connectivity
        value_template: "{{ states('sensor.god_pve_zeratul_status') == 'online' }}"
      god_pve_h340_online:
        unique_id: god_pve_h340_online
        friendly_name: "PVE H340 online"
        device_class: connectivity
        value_template: "{{ states('sensor.god_pve_h340_status') == 'online' }}"
      god_pve_vm_100_running:
        unique_id: god_pve_vm_100_running
        friendly_name: "VM 100 HA prod running"
        device_class: running
        value_template: "{{ states('sensor.god_pve_vm_100_status') == 'running' }}"
      god_pve_ct_104_running:
        unique_id: god_pve_ct_104_running
        friendly_name: "LXC 104 jarvis running"
        device_class: running
        value_template: "{{ states('sensor.god_pve_ct_104_status') == 'running' }}"
      god_pve_ct_101_running:
        unique_id: god_pve_ct_101_running
        friendly_name: "LXC 101 plex running"
        device_class: running
        value_template: "{{ states('sensor.god_pve_ct_101_status') == 'running' }}"
      god_pve_ct_171_running:
        unique_id: god_pve_ct_171_running
        friendly_name: "LXC 171 frigate running"
        device_class: running
        value_template: "{{ states('sensor.god_pve_ct_171_status') == 'running' }}"

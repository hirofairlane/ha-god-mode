---
# =====================================================================
#  gather.yml - polling playbook (multi-OS aware)
#
#  For each host: pull the agent path from /data/metadata/<host>.json
#  (written by detect_os.yml or install_agent.yml). Falls back to a
#  tried-and-true sequence of well-known paths for hosts without
#  metadata yet.
# =====================================================================
- name: GOD Mode metrics gather
  hosts: all
  gather_facts: false
  any_errors_fatal: false
  strategy: free
  vars:
    metrics_dir: /data/metrics
    metadata_dir: /data/metadata
  tasks:
    - name: Ensure metrics dir exists (controller)
      ansible.builtin.file:
        path: "{{ metrics_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Read per-host metadata if present
      ansible.builtin.set_fact:
        meta: "{{ lookup('file', metadata_dir ~ '/' ~ inventory_hostname ~ '.json', errors='ignore') | default('{}') | from_json }}"

    - name: Run agent (windows path)
      ansible.builtin.raw: |
        powershell -NoProfile -File "C:\ProgramData\god-mode\god-agent.ps1"
      register: out_win
      changed_when: false
      failed_when: false
      timeout: 10
      when: meta.god_os | default('') == 'windows'

    - name: Run agent (POSIX, known path from metadata)
      ansible.builtin.raw: |
        AGENT="{{ meta.god_agent_path | default('') | trim }}"
        if [ -n "$AGENT" ] && [ -x "$AGENT" ]; then
          "$AGENT"
        else
          # Fallback sequence
          for p in /usr/local/bin/god-agent /usr/bin/god-agent "$HOME/.local/bin/god-agent"; do
            if [ -x "$p" ]; then "$p"; exit; fi
          done
          echo '{"_ok":false,"_error":"agent_not_installed"}'
        fi
      register: out_posix
      changed_when: false
      failed_when: false
      timeout: 10
      when: meta.god_os | default('') != 'windows'

    - name: Pick the relevant stdout
      ansible.builtin.set_fact:
        agent_stdout: "{{ (out_win.stdout | default('')) if (meta.god_os | default('') == 'windows') else (out_posix.stdout | default('')) }}"

    - name: Set god_metric when agent_stdout is already a dict (Ansible auto-parsed JSON)
      ansible.builtin.set_fact:
        god_metric: "{{ agent_stdout }}"
      when: agent_stdout is mapping

    - name: Try parse JSON output (when agent_stdout is a string)
      ansible.builtin.set_fact:
        god_metric: "{{ (agent_stdout | string).strip() | from_json }}"
      failed_when: false
      ignore_errors: true
      when:
        - agent_stdout is not mapping
        - (agent_stdout | string).strip().startswith('{')

    - name: Fallback when no valid JSON
      ansible.builtin.set_fact:
        god_metric:
          _ok: false
          _error: no_output
      when: god_metric is not defined

    - name: Inject category/agent metadata into metric
      ansible.builtin.set_fact:
        god_metric: "{{ god_metric | combine({'_polled_at': lookup('pipe','date +%s')|int, '_god_os': meta.god_os | default('unknown')}) }}"

    - name: Save metric file (controller side)
      ansible.builtin.copy:
        content: "{{ god_metric | to_nice_json }}"
        dest: "{{ metrics_dir }}/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost

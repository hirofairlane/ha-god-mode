---
name: GOD Mode
slug: god_mode
version: "0.4.13"
description: >-
  Centralized homelab control plane for Home Assistant. Aggregated
  monitoring of Linux hosts, Proxmox cluster (with auto-discovery of
  VMs/LXCs), OpenWrt routers, RPi/SBCs and desktops, with Ansible
  engine. Auto-installs Lovelace dashboard and YAML packages.
url: "https://github.com/hirofairlane/ha-god-mode"
arch:
  - amd64
  - aarch64
init: false
startup: services
hassio_api: true
hassio_role: manager
homeassistant_api: true
ingress: true
panel_icon: mdi:eye-outline
panel_title: GOD Mode
ports:
  9876/tcp: 9876
ports_description:
  9876/tcp: "REST collector API (consumed by HA `rest:` integration)"
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  # Network registry (optional companion service, see registro-red/README).
  # Runs outside the addon: it holds the SSH keys to the routers and stays
  # up even if Home Assistant doesn't. Leaving the token empty just disables
  # the "Network" view without breaking anything else.
  red_api_url: "http://192.168.1.2:9877"
  red_api_token: ""
  poll_interval: 60
  pve_sync_interval: 300
  ssh_user: root
  install_packages: true
  # Self-signed CA + cert for the collector API (:9876), generated into
  # /data/pki on first start with this set to true. Off by default: the
  # collector stays plain HTTP, same as every prior version.
  tls_enabled: false
  # Example inventory — replace with your own hosts. See the addon README
  # for the full schema (category, parent, mac, pve_token_id, ...).
  hosts:
    - { name: example_pve_node, addr: 192.168.1.10, user: root, category: pve_node,
        pve_token_id: "god@pve!godmode", pve_token_secret: "" }
    - { name: example_server,   addr: 192.168.1.11, user: root, category: server, parent: example_pve_node }
    - { name: example_router,   addr: 192.168.1.1,  user: root, category: openwrt }
schema:
  red_api_url: str?
  red_api_token: password?
  poll_interval: int(15,3600)
  pve_sync_interval: int(60,3600)?
  ssh_user: str
  install_packages: bool
  tls_enabled: bool?
  hosts:
    - name: match(^[a-z0-9_]+$)
      addr: str
      user: str?
      port: port?
      category: list(pve_node|pve_vm|pve_lxc|server|rpi|desktop_linux|desktop_win|desktop_mac|openwrt)?
      chip: str?
      parent: str?
      mac: match(^([0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}$)?
      ssh_key_type: list(ed25519|rsa)?
      pve_token_id: str?
      pve_token_secret: password?

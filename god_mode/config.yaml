---
name: GOD Mode
slug: god_mode
version: "0.4.4"
description: >-
  Centralized homelab control plane for Home Assistant. Aggregated
  monitoring of Linux hosts, Proxmox cluster (with auto-discovery of
  VMs/LXCs), OpenWrt routers, RPi/SBCs and desktops, with Ansible
  engine. Auto-installs Lovelace dashboard and YAML packages.
url: "https://github.com/hirofairlane/ha-god-mode"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:eye-outline
panel_title: GOD Mode
ports:
  9876/tcp: 9876
ports_description:
  9876/tcp: "REST collector API (consumed by HA `rest:` integration)"
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  poll_interval: 60
  pve_sync_interval: 300
  ssh_user: root
  install_packages: true
  hosts:
    # ---- Proxmox cluster nodes ----
    # If pve_token_id+pve_token_secret are set, the addon will auto-discover
    # VMs/LXCs running on this node via the Proxmox API and surface them
    # under the node's dashboard view (including stopped guests).
    - { name: zeratul,           addr: 192.168.1.122, user: root,   category: pve_node,
        pve_token_id: "god@pve!godmode", pve_token_secret: "" }
    - { name: h340,              addr: 192.168.1.129, user: root,   category: pve_node, mac: "d0:bf:9c:46:64:a5",
        pve_token_id: "god@pve!godmode", pve_token_secret: "" }
    - { name: observer,          addr: 192.168.1.124, user: root,   category: pve_node,
        pve_token_id: "god@pve!godmode", pve_token_secret: "" }
    # ---- Linux servers (VMs/CTs you want monitored over SSH in addition
    #      to the API-level info their parent pve_node already exposes) ----
    - { name: plex,              addr: 192.168.1.123, user: root,   category: server,        parent: zeratul }
    - { name: frigate,           addr: 192.168.1.170, user: sergio, category: server,        parent: observer }
    - { name: crafty,            addr: 192.168.1.36,  user: root,   category: server,        parent: zeratul }
    - { name: jarvis,            addr: 192.168.1.70,  user: root,   category: server,        parent: zeratul }
    # ---- RPi / SBCs ----
    # Note: pikvm has a read-only filesystem; agent writes to tmpfs only.
    - { name: pikvm,             addr: 192.168.0.105, user: root,   category: rpi, chip: pikvm }
    # ---- Linux desktops ----
    - { name: manjaro_desktop,   addr: 192.168.0.230, user: sergio, category: desktop_linux }
    # Dual boot CachyOS + W11; RTX 5080 + 64GB; futuro nodo IA pesado.
    # WoL-on-demand (no siempre encendido).
    - { name: gigabyte_gaming,   addr: 192.168.0.25,  user: sergio, category: desktop_linux, mac: "10:ff:e0:3e:ef:0a" }
    # iMac con Manjaro; desktop ocasional, casi siempre apagado.
    - { name: imac101,           addr: 192.168.0.114, user: sergio, category: desktop_linux }
    # ---- OpenWrt routers ----
    - { name: openwrt_principal, addr: 192.168.0.1,   user: root,   category: openwrt }
    - { name: openwrt_sotano,    addr: 192.168.1.7,   user: root,   category: openwrt }
    - { name: openwrt_arriba,    addr: 192.168.1.8,   user: root,   category: openwrt }
    - { name: openwrt_caseta,    addr: 192.168.1.3,   user: root,   category: openwrt, ssh_key_type: rsa }
schema:
  poll_interval: int(15,3600)
  pve_sync_interval: int(60,3600)?
  ssh_user: str
  install_packages: bool
  hosts:
    - name: match(^[a-z0-9_]+$)
      addr: str
      user: str?
      port: port?
      category: list(pve_node|pve_vm|pve_lxc|server|rpi|desktop_linux|desktop_win|desktop_mac|openwrt)?
      chip: str?
      parent: str?
      mac: match(^([0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}$)?
      ssh_key_type: list(ed25519|rsa)?
      pve_token_id: str?
      pve_token_secret: password?

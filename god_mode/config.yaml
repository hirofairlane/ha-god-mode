---
name: GOD Mode
slug: god_mode
version: "0.3.1"
description: >-
  Centralized homelab control plane for Home Assistant. Aggregated
  monitoring of Linux hosts, Proxmox cluster, OpenWrt routers and
  desktops, with Ansible engine. Auto-installs Lovelace dashboard and
  YAML packages. Categories (pve_node, server, sbc, desktop_linux,
  desktop_win, desktop_mac, network) drive the dashboard layout.
url: "https://github.com/hirofairlane/ha-god-mode"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:eye-outline
panel_title: GOD Mode
ports:
  9876/tcp: 9876
ports_description:
  9876/tcp: "REST collector API (consumed by HA `rest:` integration)"
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  poll_interval: 60
  ssh_user: root
  install_packages: true
  pve:
    enabled: true
    host: "192.168.1.122"
    token_id: "god@pve!godmode"
    token_secret: ""
  hosts:
    # ---- Proxmox cluster nodes ----
    - { name: zeratul,           addr: 192.168.1.122, user: root,   category: pve_node }
    - { name: h340,              addr: 192.168.1.129, user: root,   category: pve_node }
    # ---- Linux servers (VMs/CTs) ----
    - { name: plex,              addr: 192.168.1.123, user: root,   category: server }
    - { name: frigate,           addr: 192.168.1.170, user: sergio, category: server }
    - { name: crafty,            addr: 192.168.1.36,  user: root,   category: server }
    - { name: jarvis,            addr: 192.168.1.70,  user: root,   category: server }
    # ---- SBCs / RPis ----
    - { name: nuc,               addr: 192.168.1.181, user: root,   category: sbc }
    - { name: rpi4_8gb,          addr: 192.168.1.216, user: root,   category: sbc }
    - { name: pikvm,             addr: 192.168.0.105, user: root,   category: sbc }
    # ---- Linux desktops (always-on are rare; usually on-demand) ----
    - { name: manjaro_desktop,   addr: 192.168.0.230, user: sergio, category: desktop_linux }
    # ---- Windows 11 ----
    - { name: gigabyte_gaming,   addr: 192.168.0.25,  user: sergio, category: desktop_win }
    # ---- macOS ----
    - { name: macbook_pro,       addr: 192.168.1.215, user: sergio, category: desktop_mac }
    - { name: imac101,           addr: 192.168.0.114, user: sergio, category: desktop_mac }
    # ---- Network: OpenWrt ----
    - { name: openwrt_principal, addr: 192.168.0.1,   user: root,   category: network }
    - { name: openwrt_sotano,    addr: 192.168.1.7,   user: root,   category: network }
    - { name: openwrt_arriba,    addr: 192.168.1.8,   user: root,   category: network }
    - { name: openwrt_caseta,    addr: 192.168.1.3,   user: root,   category: network }
schema:
  poll_interval: int(15,3600)
  ssh_user: str
  install_packages: bool
  pve:
    enabled: bool
    host: str
    token_id: str
    token_secret: password
  hosts:
    - name: match(^[a-z0-9_]+$)
      addr: str
      user: str?
      port: port?
      category: list(pve_node|server|sbc|desktop_linux|desktop_win|desktop_mac|network)?
